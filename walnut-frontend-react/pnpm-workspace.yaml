packages:
  - internal/*
  - packages/*
  - packages/@core/*
  - packages/@core/ui-kit/*
  - apps/*
  - e2e/*

publicHoistPattern: '*postcss*'

strictPeerDependencies: false
autoInstallPeers: true
dedupePeerDependents: true
verifyDepsBeforeRun: false
minimumReleaseAge: 0

# 版本尽量与 walnut-frontend/pnpm-workspace.yaml 的 catalog 对齐，
# 便于两套前端共享依赖版本、对照排查。
catalog:
  # ---- 构建工具链（与 Vue 侧一致）----
  '@types/node': ^25.9.1
  happy-dom: ^20.8.9
  typescript: ^6.0.3
  vite: 8.0.10
  vitest: ^4.1.0

  # ---- 通用运行时（与 Vue 侧一致）----
  '@ctrl/tinycolor': ^4.2.0
  axios: ^1.16.1
  axios-mock-adapter: ^2.1.0
  clsx: ^2.1.1
  crypto-js: ^4.2.0
  dayjs: ^1.11.20
  defu: ^6.1.7
  es-toolkit: ^1.45.1
  file-type: ^19.5.0
  jsencrypt: ^3.5.4
  lodash.clonedeep: ^4.5.0
  nprogress: ^0.2.0
  qs: ^6.15.2
  sm-crypto: ^0.3.13
  tailwind-merge: ^3.5.0
  theme-colors: ^0.1.0

  # ---- 类型声明（与 Vue 侧一致）----
  '@types/crypto-js': ^4.2.2
  '@types/lodash.clonedeep': ^4.5.9
  '@types/nprogress': ^0.2.3
  '@types/qs': ^6.15.1
  '@types/sm-crypto': ^0.3.4

  # ---- 样式（与 Vue 侧一致）----
  '@iconify/tailwind4': ^1.2.3
  '@tailwindcss/typography': ^0.5.19
  '@tailwindcss/vite': ^4.2.2
  sass-embedded: ^1.100.0
  tailwindcss: ^4.2.2
  tw-animate-css: ^1.4.0

  # ---- Node 构建工具链（internal/node-utils + internal/vite-config）----
  '@changesets/git': ^3.0.4
  '@manypkg/get-packages': ^3.1.0
  '@pnpm/workspace.read-manifest': ^1000.3.1
  '@types/archiver': ^7.0.0
  '@types/html-minifier-terser': ^7.0.2
  archiver: ^7.0.1
  chalk: ^5.6.2
  consola: ^3.4.2
  dotenv: ^17.4.2
  execa: ^9.6.1
  find-up: ^8.0.0
  html-minifier-terser: ^7.2.0
  ora: ^9.4.0
  pkg-types: ^2.3.1
  rimraf: ^6.1.3
  rollup-plugin-visualizer: ^7.0.1
  tsdown: ^0.23.5
  vite-plugin-compression: ^0.5.1
  vite-plugin-pwa: ^1.2.0

  # ---- React 生态（新增）----
  '@ant-design/icons': ^6.3.4
  # 与 Vue 侧 @iconify/vue@^5 保持同主版本，两端图标 API 与行为一致
  '@iconify/react': ^5.2.1
  '@tanstack/react-query': ^5.90.0
  '@tanstack/react-store': ^0.11.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.0.0
  antd: ^6.7.0
  i18next: ^26.0.0
  react: ^19.2.0
  react-dom: ^19.2.0
  react-i18next: ^16.0.0
  react-router: ^7.9.0
  zustand: ^5.0.16
  lucide-react: ^0.545.0

  # ---- 像素回归门禁（e2e/visual）----
  '@playwright/test': ^1.56.1
  pixelmatch: ^7.1.0
  pngjs: ^7.0.0
  '@types/pngjs': ^6.0.5
  cross-env: ^10.1.0

allowBuilds:
  '@parcel/watcher': set this to true or false
