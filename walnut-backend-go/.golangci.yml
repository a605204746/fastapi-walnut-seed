# 与前端 oxlint/stylelint 的严格度对齐。
# golangci-lint v2 配置格式（version: "2"）；CI 中版本钉死，升级需本地先跑通。
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck      # 未处理的 error（Go 最常见的静默失败源）
    - govet
    - ineffassign
    - staticcheck   # v2 中已合并 gosimple
    - unused
    - misspell
    - unconvert
    - bodyclose     # HTTP 响应体未关闭 → 连接泄漏
    - rowserrcheck  # database/sql 的 rows.Err() 未检查
    - sqlclosecheck
    - noctx         # 未传播 ctx 的网络/DB 调用
    - errorlint     # errors.Is/As 误用
    - makezero      # append 到非零长度 slice 的经典 bug
    - prealloc
    # nilnil 不启用：本仓库 repo/service 层约定「查无记录返回 (nil, nil)」，
    # 调用方以 nil 判定未找到；该约定与 Python 端对齐，非缺陷。

  settings:
    errcheck:
      # 显式忽略的写入类调用（日志、http.ResponseWriter 写回）
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write
        - (*log/slog.Logger).Log

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试里的错误断言由 testify 处理，不强制 errcheck
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
